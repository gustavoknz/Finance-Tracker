name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-android:
    name: Android & Common Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run Android Host-side Tests (including Shared Common)
        run: ./gradlew :shared:testAndroidHostTest

      - name: Run Android App Unit Tests
        run: ./gradlew :androidApp:testDebugUnitTest

  validate-ui-tests:
    name: Validate Compose UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Compose UI Tests (Robolectric)
        run: ./gradlew :shared:testAndroidHostTest --tests "dev.gustavo.finance.presentation.rates.ExchangeRateUiTest"

      - name: Upload UI Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-report
          path: shared/build/reports/tests/testAndroidHostTest/

  build-and-test-ios:
    name: iOS Tests
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run iOS Simulator Tests
        run: ./gradlew :shared:iosSimulatorArm64Test
